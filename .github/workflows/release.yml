name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      - uses: ./.github/actions/zig-cache
      - name: Get version
        id: version
        run: |
          python3 scripts/release.py version --tag "$GITHUB_REF_NAME" \
            >> "$GITHUB_OUTPUT"
      - name: Build normal install layout
        run: |
          zig build -Doptimize=ReleaseSafe \
            "-Dversion=${{ steps.version.outputs.version }}" \
            install --prefix ./release-install
      - name: Package binary archive, checksum, and SBOM
        run: |
          python3 scripts/release.py binary \
            --prefix ./release-install \
            --output ./release-assets \
            --version "${{ steps.version.outputs.version }}" \
            --platform "${{ matrix.platform }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.platform }}
          path: release-assets/

  source:
    name: Source archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Get version
        id: version
        run: |
          python3 scripts/release.py version --tag "$GITHUB_REF_NAME" \
            >> "$GITHUB_OUTPUT"
      - name: Package source archive and checksum
        run: |
          python3 scripts/release.py source \
            --output ./release-assets \
            --version "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source
          path: release-assets/

  release:
    name: Create release
    needs: [build, source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true
      - name: Get version
        id: version
        run: |
          python3 scripts/release.py version --tag "$GITHUB_REF_NAME" \
            >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: |
            release-assets/rpmz-*.tar.gz
            release-assets/rpmz-*.tar.xz
      - name: Create release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          name: rpmz ${{ steps.version.outputs.version }}
          body: |
            **Install:**

            ```sh
            ghr install cataggar/rpmz@v${{ steps.version.outputs.version }}
            ```

            Binary archives expose one public executable: `bin/rpmz`. Use
            `rpmz tdnf [options] COMMAND` for dnf/yum-compatible operations,
            `rpmz repo-config` for repository configuration, and `rpmz auto`
            for scheduled updates. The archives also contain `lib/`,
            `libexec/`, and `etc/`, plus COPYING and README.md. SHA-256
            sidecars, SPDX SBOMs, and GitHub provenance attestations are
            published with the archives.
          files: |
            release-assets/rpmz-*.tar.gz
            release-assets/rpmz-*.tar.xz
            release-assets/rpmz-*.sha256
            release-assets/rpmz-*.sbom.spdx.json
          prerelease: ${{ steps.version.outputs.prerelease }}

  post-release-smoke:
    name: ghr install smoke (${{ matrix.platform }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned ghr
        run: pipx install ghr-bin==0.7.0
      - name: Get version
        id: version
        run: |
          python3 scripts/release.py version --tag "$GITHUB_REF_NAME" \
            >> "$GITHUB_OUTPUT"
      - name: Install and audit published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/release-smoke.py \
            --repo cataggar/rpmz \
            --tag "$GITHUB_REF_NAME" \
            --version "${{ steps.version.outputs.version }}" \
            --platform "${{ matrix.platform }}" \
            --prefix "$RUNNER_TEMP/rpmz-ghr-smoke"
