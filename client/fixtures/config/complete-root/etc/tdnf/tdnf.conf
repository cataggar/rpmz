[main]
installonly_limit=9
clean_requirements_on_remove=true
gpgcheck=true
cligpgcheck=false
connect_timeout=15
sslverify=false
keepcache=1
reposdir=/etc/custom.repos.d
cachedir=/var/cache/custom
persistdir=/var/lib/custom
distroverpkg=release-a release-b
excludepkgs=bad-a bad-b
minversions=inline>=1
openmax=4096
dnf_check_update_compat=true
distrosync_reinstall_changed=1
proxy=https://proxy.example.test:8443
proxy_username=alice
proxy_password=secret
installonlypkgs=kernel kernel-core
varsdir=/vars/a /vars/b
plugins=true
pluginconfpath=/pluginconf
pluginpath=/plugins
tsflags=noscripts justdb nopre notriggerin noconfigs
